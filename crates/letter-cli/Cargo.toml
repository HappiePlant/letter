[package]
name = "letter-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.20", features = ["derive"] }
toml = "0.8.19"
url = "2.5.2"
serde = { version = "1.0.210", features = ["derive"] }
directories = "5.0.1"
ansi_term = "0.12.1"
reqwest = { version = "0.13", features = ["json"] }
letter-core = { path = "../letter" }
tokio = { version = "1", features = ["full"] }
sha2 = "0.11.0"
hex = "0.4.3"
zip = "9.0.5"
globset = "0.4.20"
clap_complete = "4.6.11"
thiserror = "2.0.21"

[[bin]]
name = "letter"
path = "src/main.rs"
