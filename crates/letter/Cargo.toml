[package]
name = "letter-core"
version = "0.1.0"
edition = "2024"

[features]
default = []
generate-openapi = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = "5"

[[bin]]
name = "letter-generate-openapi"
path = "src/generate.rs"
required-features = ["generate-openapi"]